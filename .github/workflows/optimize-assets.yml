name: Optimize web assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install image optimizer
        run: npm install --no-save sharp

      - name: Create optimized images
        run: |
          mkdir -p optimized
          node <<'NODE'
          const sharp = require('sharp');
          const images = [
            ['Ext 2.jpg', 'optimized/ext-2.webp', 2400, 82],
            ['01.jpg', 'optimized/01.webp', 2200, 80],
            ['02.jpg', 'optimized/02.webp', 2200, 80],
            ['03.jpg', 'optimized/03.webp', 2200, 80],
            ['04.jpg', 'optimized/04.webp', 2200, 80],
            ['04B.jpg', 'optimized/04b.webp', 2200, 80],
            ['05.jpg', 'optimized/05.webp', 2200, 80],
            ['Ext 1.jpg', 'optimized/ext-1.webp', 2200, 82],
            ['Planta.jpg', 'optimized/planta.webp', 2400, 82],
          ];
          (async () => {
            for (const [input, output, width, quality] of images) {
              await sharp(input)
                .resize({ width, withoutEnlargement: true })
                .webp({ quality })
                .toFile(output);
              console.log(`Created ${output}`);
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add optimized
          if ! git diff --cached --quiet; then
            git commit -m "Optimize images for web"
            git push
          else
            echo "No optimized image changes to commit"
          fi
