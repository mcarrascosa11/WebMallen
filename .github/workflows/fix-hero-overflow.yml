name: Fix hero text overflow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust hero panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '  </style>'
          css = '''\n@media(min-width:701px){.panel{top:5%;bottom:5%;padding:38px 40px;justify-content:space-between}.k{margin-bottom:20px}.panel h1{font-size:clamp(44px,4.4vw,62px);line-height:.9}.panel p{margin:18px 0}.cta-link{margin-top:24px}}\n'''
          if css.strip() not in s:
              s = s.replace(marker, css + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-hero-overflow.yml
          git rm .github/workflows/fix-hero-overflow.yml
          git commit -m 'Fix hero text overflow' || exit 0
          git push